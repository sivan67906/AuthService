version: '3.8'

services:
  authservice-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: authservice-api
    ports:
      - "5000:80"
      - "5001:443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__CommandDatabase=Server=sqlserver;Database=AuthService_Command;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;MultipleActiveResultSets=true
      - ConnectionStrings__QueryDatabase=Host=postgres;Port=5432;Database=AuthService_Query;Username=postgres;Password=postgres123
    depends_on:
      - sqlserver
      - postgres
    networks:
      - authservice-network
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: authservice-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - authservice-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: authservice-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
      - POSTGRES_DB=AuthService_Query
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - authservice-network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: authservice-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@authservice.com
      - PGADMIN_DEFAULT_PASSWORD=admin123
    ports:
      - "8080:80"
    depends_on:
      - postgres
    networks:
      - authservice-network
    restart: unless-stopped

networks:
  authservice-network:
    driver: bridge

volumes:
  sqlserver-data:
    driver: local
  postgres-data:
    driver: local
